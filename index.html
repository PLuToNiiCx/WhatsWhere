<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WhatsWhere">
<title>WhatsWhere</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#14160f;--mute:#6b6f62;--line:#e1e0d6;--acc:#4d7c0f;--accfg:#fff;--glow:rgba(77,124,15,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d08;--card:#141810;--ink:#f1f3e8;--mute:#8d927f;--line:#262b1d;--acc:#c6f432;--accfg:#10140a;--glow:rgba(198,244,50,.16);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d08;--card:#141810;--ink:#f1f3e8;--mute:#8d927f;--line:#262b1d;--acc:#c6f432;--accfg:#10140a;--glow:rgba(198,244,50,.16);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,var(--glow),transparent 60%),var(--bg);color:var(--ink);font:400 16px/1.45 "Space Grotesk",system-ui,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:18px clamp(14px,4vw,32px) 90px}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:8px}
.logo{font-weight:700;letter-spacing:-.03em;font-size:15px;display:flex;gap:8px;align-items:center}.logo i{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
h1{font-size:clamp(22px,6.4vw,72px);line-height:.98;letter-spacing:-.045em;margin:18px 0 20px;font-weight:700;white-space:nowrap}
h1 em{font-style:normal;color:var(--acc)}
h2{font-size:22px;letter-spacing:-.02em;margin:0}
.search{display:flex;gap:8px;margin-bottom:22px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:11px 18px;font-weight:500}
button.p{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:700}
button.g{background:transparent}button.d{color:#d9480f}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;margin:0 0 18px}.tabs button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 40px var(--glow)}
.card .ic{font-size:34px}.card b{display:block;font-size:19px;letter-spacing:-.02em;margin-top:10px}.card span{color:var(--mute);font-size:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 4px}
.it{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);cursor:pointer}
.it img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.it .ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:28px;color:var(--mute)}
.it div.t{padding:9px 11px;font-size:14px;font-weight:500}.it small{display:block;color:var(--mute);font-weight:400}
.sec{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.hit{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:8px;cursor:pointer}
.hit b{display:block}.hit span{color:var(--acc);font-size:14px}.hit img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.pl{perspective:1400px;height:min(62vh,520px);display:grid;place-items:center;overflow:hidden}
.iso{display:grid;grid-template-columns:repeat(var(--c,3),clamp(90px,22vw,170px));gap:10px;transform:rotateX(58deg) rotateZ(-38deg);transform-style:preserve-3d}
.tile{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--acc);display:grid;place-items:center;text-align:center;font-size:13px;font-weight:700;padding:6px;cursor:pointer;box-shadow:6px 6px 0 var(--glow),12px 12px 0 var(--line);transition:.25s;transform:translateZ(0)}
.tile:hover{transform:translateZ(30px);background:var(--acc);color:var(--accfg)}.tile span{display:block;font-size:26px}.tile small{font-weight:400;opacity:.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:end center;z-index:20;padding:0}
.box{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media(min-width:700px){.modal{place-items:center}.box{border-radius:26px}}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
video{width:100%;border-radius:16px;background:#000}.hint{color:var(--mute);font-size:14px}
.empty{color:var(--mute);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:18px}
.back{margin-bottom:6px}.bc{color:var(--mute);font-size:14px}
.fp{position:relative;width:100%;max-width:900px;margin:12px auto;border:2px solid var(--line);border-radius:12px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100%/12) calc(100%/var(--h));transition:transform .5s}
.fp.d3{transform:rotateX(55deg) rotateZ(-40deg) scale(.8);transform-style:preserve-3d;margin:70px auto}
.rm{position:absolute;border:2px solid var(--acc);background:var(--card);border-radius:8px;display:grid;place-content:center;text-align:center;font-size:12px;font-weight:700;cursor:pointer;overflow:hidden;line-height:1.25}
.rm span{font-size:22px}.rm small{font-weight:400;color:var(--mute)}.d3 .rm{box-shadow:5px 5px 0 var(--glow),10px 10px 0 var(--line)}
.ed .rm{touch-action:none;cursor:move}.rz{position:absolute;right:0;bottom:0;width:24px;height:24px;background:var(--acc);border-radius:8px 0 6px 0;cursor:nwse-resize}
.tabs button.on2,.row button.on{background:var(--ink);color:var(--bg)}
.pw{display:flex;gap:14px;align-items:flex-start}.pf{flex:0 0 var(--pf,clamp(84px,22vw,130px));aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;transition:.2s}.pf:hover{border-color:var(--acc);box-shadow:0 6px 24px var(--glow)}.pf img{width:100%;height:100%;object-fit:cover;display:block}.pb{flex:1;min-width:0}
.szb{padding:9px 13px;min-width:40px}.sz-s .it .t{font-size:12px;padding:6px 8px}.sz-s .it small{display:none}.sz-l .it .t{font-size:16px;padding:11px 13px}
.dd{position:relative}.ddm{position:absolute;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:10;min-width:150px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.ddm button{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;padding:10px 12px}.ddm button.on{background:var(--ink);color:var(--bg)}
.it{position:relative}.cp{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.55);display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.cp:hover{background:rgba(0,0,0,.8)}.cp svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sz-s .cp{width:24px;height:24px;top:5px;right:5px}.sz-s .cp svg{width:13px;height:13px}
.cimg,.it .cimg{position:absolute;max-width:none;aspect-ratio:auto;object-fit:fill;display:block}.ph2{position:relative;aspect-ratio:4/3;overflow:hidden;width:100%}
#isel{position:absolute;border:2px solid var(--acc);box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;box-sizing:border-box}#ihnd{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;background:var(--acc);border-radius:9px 0 6px 0;cursor:nwse-resize}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
let S={rooms:[]},view={t:'home'},tab='lijst',q='',modal=null,db=null,assets=null,ref=null,sync='lokaal',busy=false;
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONS=['🛋️','🍳','🛏️','🚿','🧰','🚗','🌳','📦','👕','🧸'];
const TYPES=['Kast','Lade','Plank','Doos','Gereedschapskist','Rek','Anders'];
function ld(){try{const x=JSON.parse(localStorage.getItem('inv')||'null');if(x&&x.rooms)S=x}catch(e){}}
async function save(){try{localStorage.setItem('inv',JSON.stringify(S))}catch(e){}
 if(ref){try{await ref.set({json:JSON.stringify(S)});sync='gesynchroniseerd'}catch(e){sync='lokaal'}}}
async function init(){ld();render();
 try{const c=window.claude&&await claude.use('db');if(c){db=c;ref=db.doc('inv/main');
  const s=await ref.get();if(s.exists&&s.data().json){S=JSON.parse(s.data().json)}else if(S.rooms.length){await ref.set({json:JSON.stringify(S)})}
  sync='gesynchroniseerd';if(ref.onSnapshot)ref.onSnapshot(sn=>{if(sn.exists&&sn.data().json&&!modal){const j=sn.data().json;if(j!==JSON.stringify(S)){S=JSON.parse(j);render()}}});render()}}catch(e){}
 try{assets=window.claude?await claude.use('assets'):null}catch(e){}}
const room=id=>S.rooms.find(r=>r.id==id),cnt=r=>r.places.reduce((n,p)=>n+p.items.length,0);
function all(){const o=[];S.rooms.forEach(r=>r.places.forEach(p=>p.items.forEach(i=>o.push({i,r,p}))));return o}
function render(){const a=$('app');let h=`<header><div class="logo" onclick="go()" role="button" tabindex="0" style="cursor:pointer"><i></i>WhatsWhere</div><div class="row"><span class="hint">${sync}</span><button class="g" aria-label="Opties" onclick="showTheme()">⚙️</button></div></header>`;
 if(view.t=='home'){
  h+=`<h1>Nooit meer iets <em>kwijt.</em></h1><div class="search"><input id="q" placeholder="Zoek een voorwerp, bijv. 'paspoort'…" value="${esc(q)}" oninput="q=this.value;res()"></div><div id="res"></div>`;
  h+=`<div id="main">${q?'':quick()+home()}</div>`}
 else{const r=room(view.r);if(!r){view={t:'home'};return render()}h+=roomView(r)}
 a.innerHTML=h+(modal||'');setTimeout(drawBc,0);if(q&&view.t=='home'){res()}}
function res(){const m=$('main'),x=$('res');if(!q){x.innerHTML='';m.style.display='';return}
 m.style.display='none';const k=q.toLowerCase(),f=all().filter(o=>(o.i.name+' '+(o.i.note||'')+' '+(o.i.code||'')).toLowerCase().includes(k));
 x.innerHTML=f.length?f.map(o=>`<div class="hit" onclick="go('${o.r.id}')">${o.i.photo?`<img src="${o.i.photo}">`:'<div style="font-size:26px">📦</div>'}<div><b>${esc(o.i.name)}</b><span>${esc(o.r.name)} → ${esc(o.p.name)}${o.i.vak?' → '+esc(o.i.vak):''}</span></div></div>`).join(''):'<div class="empty">Niets gevonden.</div>'}
function home(){let h=`<div class="tabs"><button class="${tab=='lijst'?'on':''}" onclick="tab='lijst';render()">Ruimtes</button><button class="${tab=='3d'?'on':''}" onclick="tab='3d';render()">Plattegrond</button></div>`;
 if(!S.rooms.length)return h+`<div class="empty">Nog geen ruimtes. Begin met de eerste, bijvoorbeeld "Woonkamer".<br><br><button class="p" onclick="addRoom()">+ Ruimte toevoegen</button></div>`;
 if(tab=='3d')h+=plan();
 else h+=`<div class="grid">${S.rooms.map(r=>`<div class="card" onclick="go('${r.id}')"><div class="ic">${r.icon}</div><b>${esc(r.name)}</b><span>${r.places.length} opbergplaatsen · ${cnt(r)} items</span></div>`).join('')}</div>`;
 return h+`<p><button class="p" onclick="addRoom()">+ Ruimte</button></p>`}
function roomView(r){let h=`<button class="g back" onclick="go()">← Alle ruimtes</button><div class="row sp"><h2>${r.icon} ${esc(r.name)}</h2><div class="row"><button class="g" onclick="addRoom('${r.id}')">Wijzig</button><button class="p" onclick="addPlace('${r.id}')">+ Opbergplaats</button></div></div><br>`;
 if(!r.places.length)h+=`<div class="empty" onclick="addPlace('${r.id}')" role="button" tabindex="0" style="cursor:pointer">Voeg opbergplaats toe.</div>`;
 r.places.forEach(p=>{h+=`<div class="sec pw sz-${p.size||'m'}"><div class="pf" onclick="addPlace('${r.id}','${p.id}')" role="button" tabindex="0">${pimg(p)}</div><div class="pb"><div class="row sp"><div><b style="font-size:18px">${esc(p.name)}</b></div><div class="row"><div class="dd"><button class="g" onclick="ddToggle(this)">Thumbnails ▾</button><div class="ddm" hidden>${[['s','Klein'],['m','Normaal'],['l','Groot']].map(([k,t])=>`<button class="${(p.size||'m')==k?'on':''}" onclick="setSize('${r.id}','${p.id}','${k}')">${t}</button>`).join('')}</div></div><button class="g" onclick="addPlace('${r.id}','${p.id}')">Wijzig</button><button class="p" onclick="addItem('${r.id}','${p.id}')">+ Item</button></div></div>${grp(r,p)}</div></div>`});return h}
function itm(r,p,i){return `<div class="it" onclick="addItem('${r.id}','${p.id}','${i.id}')"><button class="cp" title="Kopieer" aria-label="Kopieer" onclick="event.stopPropagation();dupItem('${r.id}','${p.id}','${i.id}')"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>${i.photo?thumb(i):'<div class="ph">📦</div>'}<div class="t">${esc(i.name)}${i.note?`<small>${esc(i.note)}</small>`:''}</div></div>`}
function grp(r,p){if(!p.items.length)return '<div class="items"><span class="hint">Nog leeg.</span></div>';const vs=[...new Set(p.items.map(i=>i.vak||''))].sort((a,b)=>!a?-1:!b?1:a.localeCompare(b));return vs.map(v=>`${v?`<div class="bc" style="margin-top:12px;font-weight:700">▸ ${esc(v)}</div>`:''}<div class="items" style="${igs(p)}">${p.items.filter(i=>(i.vak||'')==v).map(i=>itm(r,p,i)).join('')}</div>`).join('')}
function go(r){view=r?{t:'room',r}:{t:'home'};q='';render();scrollTo(0,0)}
function open(h){modal=`<div class="modal" onclick="if(event.target===this)close_()"><div class="box">${h}</div></div>`;render()}
function close_(){stopCam();modal=null;render()}
function addRoom(id){const r=id?room(id):null;open(`<h2>${r?'Ruimte wijzigen':'Nieuwe ruimte'}</h2><label>Naam</label><input id="n" value="${esc(r?.name||'')}" placeholder="Bijv. Garage"><label>Icoon</label><div class="row">${ICONS.map(i=>`<button class="g" onclick="this.parentNode.dataset.v='${i}';[...this.parentNode.children].forEach(b=>b.style.borderColor='');this.style.borderColor='var(--acc)'" style="font-size:22px;padding:8px 12px">${i}</button>`).join('')}</div><br><div class="row sp"><button class="p" onclick="sRoom('${id||''}')">Opslaan</button>${r?`<button class="d g" onclick="del('r','${id}')">Verwijder</button>`:''}<button class="g" onclick="close_()">Annuleer</button></div>`)}
function sRoom(id){const n=$('n').value.trim();if(!n)return;const ic=document.querySelector('.box .row[data-v]')?.dataset.v;
 if(id){const r=room(id);r.name=n;if(ic)r.icon=ic}else S.rooms.push({id:uid(),name:n,icon:ic||'📦',places:[]});modal=null;save();render()}
function addPlace(rid,pid){const p=pid?room(rid).places.find(x=>x.id==pid):null;open(`<h2>${p?'Opbergplaats wijzigen':'Nieuwe opbergplaats'}</h2><label>Naam</label><input id="n" value="${esc(p?.name||'')}" placeholder="Bijv. Bovenste kast links"><br><br><div class="row sp"><button class="p" onclick="sPlace('${rid}','${pid||''}')">Opslaan</button>${p?`<button class="d g" onclick="del('p','${rid}','${pid}')">Verwijder</button>`:''}<button class="g" onclick="close_()">Annuleer</button></div>`)}
function sPlace(rid,pid){const n=$('n').value.trim();if(!n)return;const r=room(rid);if(pid){const p=r.places.find(x=>x.id==pid);p.name=n}else r.places.push({id:uid(),name:n,items:[]});modal=null;save();render()}
let cur=null;
function addItem(rid,pid,iid,code){const r=room(rid),p=r.places.find(x=>x.id==pid),i=iid?p.items.find(x=>x.id==iid):null;cur={photo:i?.photo||'',crop:i?.crop?{...i.crop}:null,code:i?.code||code||''};
 open(`<h2>${i?'Item wijzigen':'Nieuw item'}</h2><label>Wat is het?</label><input id="n" value="${esc(i?.name||'')}" placeholder="Bijv. Boormachine, paspoort of medicijnen"><label>Notitie</label><input id="no" value="${esc(i?.note||'')}"><label>Sublocatie (optioneel)</label><input id="vk" list="vl" value="${esc(i?.vak||'')}" placeholder="Bijv. 2e plank of bovenste lade"><datalist id="vl">${[...new Set(p.items.map(x=>x.vak).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist><label>Barcode</label><div class="row"><input id="bc" value="${esc(cur.code)}" style="flex:1"><button class="g" onclick="scan('${rid}','${pid}',true)">▥ Scan</button></div><label>Foto</label><div id="pv">${cur.photo?`<img src="${cur.photo}" style="width:100%;border-radius:14px">`:''}</div><input type="file" accept="image/*" capture="environment" onchange="photo(this)"><br><br><div class="row sp"><button class="p" id="sv" onclick="sItem('${rid}','${pid}','${iid||''}')">Opslaan</button>${i?`<button class="d g" onclick="del('i','${rid}','${pid}','${iid}')">Verwijder</button>`:''}<button class="g" onclick="close_()">Annuleer</button></div>`)}
function small(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.75)};im.src=URL.createObjectURL(f)})}
async function photo(el){const f=el.files[0];if(!f)return;busy=true;$('sv').disabled=true;const b=await small(f);let u=null;
 try{if(assets)u=(await assets.upload(b)).url}catch(e){}
 if(!u){u=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(b)})}
 cur.photo=u;$('pv').innerHTML=`<img src="${u}" style="width:100%;border-radius:14px">`;$('sv').disabled=false;busy=false}
function sItem(rid,pid,iid){const n=$('n').value.trim();if(!n)return;const p=room(rid).places.find(x=>x.id==pid),d={name:n,note:$('no').value.trim(),code:$('bc').value.trim(),vak:$('vk').value.trim(),photo:cur.photo};
 if(iid)Object.assign(p.items.find(x=>x.id==iid),d);else p.items.push({id:uid(),...d});modal=null;save();render()}
function del(t,a,b,c){if(!confirm('Zeker weten?'))return;if(t=='r')S.rooms=S.rooms.filter(r=>r.id!=a),view={t:'home'};if(t=='p'){const r=room(a);r.places=r.places.filter(p=>p.id!=b)}if(t=='i'){const p=room(a).places.find(p=>p.id==b);p.items=p.items.filter(i=>i.id!=c)}modal=null;save();render()}
let stream=null,raf=0;
function stopCam(){cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
async function scan(rid,pid,fill){const keep=fill?{n:$('n').value,no:$('no').value}:null;
 open(`<h2>Barcode scannen</h2><video id="v" playsinline muted style="display:none"></video><p class="hint" id="sm">Maak een foto van de barcode, of typ de code.</p><input type="file" accept="image/*" capture="environment" onchange="scanPhoto(this)"><br><br><div class="row"><input id="man" placeholder="Of typ de code"><button class="p" onclick="found($('man').value)">OK</button></div><br><button class="g" onclick="close_()">Sluiten</button>`);
 window._ctx={rid,pid,fill,keep};
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('v');v.srcObject=stream;v.style.display='block';await v.play();

let CR=null,CRd=null;
function placePhoto(el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const B=Math.min(280,$('pv').clientWidth||280),sc=Math.min(B/im.width,B/im.height),sv=Math.max(B/im.width,B/im.height);CR={im,B,sc,z:1,zmax:Math.max(1.5,sv/sc*3),ox:(B-im.width*sc)/2,oy:(B-im.height*sc)/2};showCrop()};im.src=URL.createObjectURL(f);el.value=''}
function showCrop(){const c=CR;$('pv').innerHTML=`<div id="cb" style="width:${c.B}px;height:${c.B}px;position:relative;overflow:hidden;border-radius:14px;background:#111;touch-action:none;margin:0 auto;cursor:grab"><img id="ci" style="position:absolute;max-width:none;user-select:none;pointer-events:none"></div><input type="range" id="cz" min="1" max="${c.zmax}" step="0.01" value="${c.z}" style="margin-top:10px;padding:0;border:0;background:transparent" oninput="cZoom(this.value)"><div class="row" style="margin-top:6px"><button class="p" onclick="cApply()">Toepassen</button><button class="g" onclick="cCancel()">Annuleren</button></div><p class="hint">Sleep om te verschuiven, schuif om in of uit te zoomen.</p>`;$('ci').src=c.im.src;cPos()}
function cPos(){const c=CR,s=c.sc*c.z,w=c.im.width*s,h=c.im.height*s;c.ox=w<=c.B?(c.B-w)/2:Math.min(0,Math.max(c.B-w,c.ox));c.oy=h<=c.B?(c.B-h)/2:Math.min(0,Math.max(c.B-h,c.oy));const i=$('ci');if(!i)return;i.style.width=w+'px';i.style.height=h+'px';i.style.left=c.ox+'px';i.style.top=c.oy+'px'}
function cZoom(v){const c=CR,o=c.sc*c.z,cx=(c.B/2-c.ox)/o,cy=(c.B/2-c.oy)/o;c.z=+v;const s=c.sc*c.z;c.ox=c.B/2-cx*s;c.oy=c.B/2-cy*s;cPos()}

 const sv=$('sv');if(sv)sv.disabled=true;const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));let u=null;try{if(assets)u=(await assets.upload(b)).url}catch(e){}
 if(!u)u=await new Promise(r=>{const f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(b)});

function loadImg(u){return new Promise(async res=>{let src=u;try{const r=await fetch(u);if(r.ok)src=URL.createObjectURL(await r.blob())}catch(e){}const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src})}
async function cEdit(){const u=cur.src||cur.photo;if(!u)return;const im=await loadImg(u);if(!im)return;const B=Math.min(280,$('pv').clientWidth||280),sc=Math.min(B/im.width,B/im.height),sv=Math.max(B/im.width,B/im.height),cr=cur.crop;
 CR={im,B,sc,z:1,zmax:Math.max(1.5,sv/sc*3),ox:(B-im.width*sc)/2,oy:(B-im.height*sc)/2,srcUrl:cur.src||null};
 if(cr&&cur.src){CR.z=Math.min(CR.zmax,Math.max(1,cr.z));const s=sc*CR.z;CR.ox=B/2-cr.fx*im.width*s;CR.oy=B/2-cr.fy*im.height*s}
 showCrop()}
async function cApply(){const c=CR;if(!c)return;const s=c.sc*c.z,k=600/c.B,sv=$('sv');if(sv)sv.disabled=true;
 const up=async b=>{let u=null;try{if(assets)u=(await assets.upload(b)).url}catch(e){}if(!u)u=await new Promise(r=>{const f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(b)});return u};
 const cv=document.createElement('canvas');cv.width=cv.height=600;const x=cv.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,600,600);x.drawImage(c.im,c.ox*k,c.oy*k,c.im.width*s*k,c.im.height*s*k);
 try{const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));cur.photo=await up(b);
  if(!c.srcUrl){const m=Math.min(1,1000/Math.max(c.im.width,c.im.height)),o=document.createElement('canvas');o.width=Math.round(c.im.width*m);o.height=Math.round(c.im.height*m);o.getContext('2d').drawImage(c.im,0,0,o.width,o.height);cur.src=await up(await new Promise(r=>o.toBlob(r,'image/jpeg',.8)))}
  cur.crop={z:c.z,fx:(c.B/2-c.ox)/s/c.im.width,fy:(c.B/2-c.oy)/s/c.im.height}}catch(e){}
 CR=null;const pv=$('pv');if(pv)pv.innerHTML=pvHtml();if(sv)sv.disabled=false}

async function sPlace(rid,pid){if(CR&&$('cb'))await cApply();const n=$('n').value.trim();if(!n)return;const r=room(rid);if(pid){const p=r.places.find(x=>x.id==pid);p.name=n;p.photo=cur.photo;p.src=cur.src;p.crop=cur.crop}else r.places.push({id:uid(),name:n,photo:cur.photo,src:cur.src,crop:cur.crop,items:[]});modal=null;save();render()}

async function camera(id){const inp=$(id);if(matchMedia('(pointer:coarse)').matches||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){inp.click();return}
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});openCam(st,inp)}catch(e){if(e&&(e.name=='NotFoundError'||e.name=='OverconstrainedError'||e.name=='NotReadableError'))inp.click();else toast('Camera niet beschikbaar of geen toestemming. Kies een bestand.')}}

 o.innerHTML='<div style="width:min(640px,100%);display:grid;gap:12px"><video id="camv" playsinline muted style="width:100%;border-radius:16px;background:#000"></video><div class="row" style="justify-content:center"><button class="p" id="camok">Foto maken</button><button class="g" id="camno" style="color:#fff">Annuleren</button></div></div>';
 document.body.appendChild(o);const v=o.querySelector('#camv');v.srcObject=st;v.play();
 const end=()=>{st.getTracks().forEach(t=>t.stop());o.remove()};
 o.querySelector('#camno').onclick=e=>{e.preventDefault();e.stopPropagation();end()};

function cdim(c){const a=c.a||4/3;return[(a>=4/3?a/(4/3)*100:100)*c.z,(a>=4/3?100:(4/3)/a*100)*c.z]}
function cclamp(c){const[W,H]=cdim(c);c.fx=Math.min(1-50/W,Math.max(50/W,c.fx));c.fy=Math.min(1-50/H,Math.max(50/H,c.fy))}
function cbox(c){const[W,H]=cdim(c);let l=50-c.fx*W,t=50-c.fy*H;l=Math.min(0,Math.max(100-W,l));t=Math.min(0,Math.max(100-H,t));return `width:${W}%;height:${H}%;left:${l}%;top:${t}%`}

 if(!u)u=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(b)});
